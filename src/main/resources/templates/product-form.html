<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title th:text="${pageTitle}">Produit</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><div th:replace="~{fragments :: navbar}"></div>
<main class="container" style="max-width:760px">
 <div class="card shadow-sm"><div class="card-body p-4">
  <h1 class="h3 mb-4" th:text="${pageTitle}"></h1>
  <form th:action="@{/products/save}" th:object="${product}" method="post">
   <input type="hidden" th:field="*{id}">
   <div class="mb-3"><label class="form-label">Nom</label><input class="form-control" th:field="*{name}">
    <div class="text-danger small" th:errors="*{name}"></div></div>
   <div class="mb-3"><label class="form-label">Prix (DH)</label><input class="form-control" type="number" step="0.01" th:field="*{price}">
    <div class="text-danger small" th:errors="*{price}"></div></div>
   <div class="mb-3"><label class="form-label">Quantité</label><input class="form-control" type="number" th:field="*{quantity}">
    <div class="text-danger small" th:errors="*{quantity}"></div></div>
   <div class="mb-3"><label class="form-label">Description</label><textarea class="form-control" rows="3" th:field="*{description}"></textarea>
    <div class="text-danger small" th:errors="*{description}"></div></div>
   <button class="btn btn-primary" type="submit">Enregistrer</button>
   <a class="btn btn-secondary" th:href="@{/products}">Annuler</a>
  </form>
 </div></div>
</main><div th:replace="~{fragments :: footer}"></div></body></html>
