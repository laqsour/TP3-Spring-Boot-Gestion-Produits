<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connexion</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head>
<body class="bg-light"><main class="container d-flex align-items-center justify-content-center" style="min-height:100vh">
 <div class="card shadow-sm p-4" style="width:100%;max-width:420px">
  <h1 class="h3 mb-3 text-center">Connexion</h1>
  <div th:if="${param.error}" class="alert alert-danger">Identifiants incorrects.</div>
  <div th:if="${param.logout}" class="alert alert-success">Vous êtes déconnecté.</div>
  <form th:action="@{/login}" method="post">
   <div class="mb-3"><label class="form-label">Nom d'utilisateur</label><input class="form-control" name="username" required autofocus></div>
   <div class="mb-3"><label class="form-label">Mot de passe</label><input class="form-control" type="password" name="password" required></div>
   <button class="btn btn-primary w-100" type="submit">Se connecter</button>
  </form>
  <p class="text-muted small mt-3 mb-0">Compte de démonstration : admin / admin123</p>
 </div>
</main></body></html>
