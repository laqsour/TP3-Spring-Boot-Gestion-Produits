<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
 <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
 <title>Liste des produits</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments :: navbar}"></div>
<main class="container">
 <div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3">Liste des produits</h1><a class="btn btn-primary" th:href="@{/products/new}">+ Ajouter</a>
 </div>
 <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
 <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
 <form class="row g-2 mb-3" method="get" th:action="@{/products}">
  <div class="col-sm-9"><input class="form-control" name="keyword" th:value="${keyword}" placeholder="Rechercher par nom ou description"></div>
  <div class="col-auto"><button class="btn btn-outline-primary">Rechercher</button></div>
  <div class="col-auto"><a class="btn btn-outline-secondary" th:href="@{/products}">Réinitialiser</a></div>
 </form>
 <div class="card shadow-sm"><div class="table-responsive">
  <table class="table table-striped table-hover mb-0">
   <thead class="table-dark"><tr><th>ID</th><th>Nom</th><th>Prix (DH)</th><th>Quantité</th><th>Description</th><th>Actions</th></tr></thead>
   <tbody>
    <tr th:each="p : ${products}">
     <td th:text="${p.id}"></td><td th:text="${p.name}"></td>
     <td th:text="${#numbers.formatDecimal(p.price,1,2)}"></td><td th:text="${p.quantity}"></td>
     <td th:text="${p.description}"></td>
     <td class="text-nowrap">
      <a class="btn btn-sm btn-warning" th:href="@{/products/edit/{id}(id=${p.id})}">Modifier</a>
      <form class="d-inline" th:action="@{/products/delete/{id}(id=${p.id})}" method="post" onsubmit="return confirm('Supprimer ce produit ?')">
       <button class="btn btn-sm btn-danger" type="submit">Supprimer</button>
      </form>
     </td>
    </tr>
    <tr th:if="${#lists.isEmpty(products)}"><td colspan="6" class="text-center py-4">Aucun produit trouvé.</td></tr>
   </tbody>
  </table>
 </div></div>
</main>
<div th:replace="~{fragments :: footer}"></div>
</body></html>
