spring.application.name=gestion-produits
server.port=8081

# Base H2 en mémoire (données réinitialisées à chaque redémarrage)
spring.datasource.url=jdbc:h2:mem:productsdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Pour MySQL, utiliser le profil mysql et configurer les variables d'environnement.
